name: Request Profile Release

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: Optional build run ID. Leave blank for the latest successful main push build.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Request Profile Release
    permissions:
      contents: write
      actions: read
    uses: mitre/inspec-profile-workflows/.github/workflows/release.yml@df0ccf9fbac9c45c951aee4e33d5734894007950
    with:
      build-run-id: ${{ inputs.build-run-id }}
      build-workflow: build.yml
